<h1>Building a High-Performance API Gateway with Node.js</h1>
<div class="post-author-row">
    <div class="post-author-avatar" style="background:#6366f1">BC</div>

<div class="prose">
<p>When our backend grew from a monolith into eight microservices, we quickly realized every service had its own auth logic, rate limiting, and inconsistent API contracts. Client apps were calling different endpoints with three different auth schemes. Something had to change.</p>

<h2>The Problem with Direct Service Access</h2>
<p>Imagine a mobile app needing to show a user's dashboard. It would call the user service, orders service, and notifications service — three separate requests, three separate tokens, three separate error handling paths. The complexity grows quadratically with each new service.</p>

<blockquote>A centralized gateway isn't just a convenience — it's a necessity at scale.</blockquote>

<h2>Architecture Overview</h2>
<p>The gateway is built on Express with three core responsibilities: authentication, rate limiting, and proxying. Every inbound request passes through the same auth middleware before being forwarded to the appropriate upstream service.</p>

<pre><code><span class="kw">const</span> <span class="fn">rateLimiter</span> = (options = {}) => {
  <span class="kw">const</span> { windowMs = <span class="num">60000</span>, max = <span class="num">100</span> } = options;

  <span class="kw">return async</span> (req, res, next) => {
    <span class="kw">const</span> key = <span class="str">\`rl:\${req.user?.id || req.ip}\`</span>;
    <span class="kw">const</span> current = <span class="kw">await</span> redis.<span class="fn">incr</span>(key);

    <span class="kw">if</span> (current === <span class="num">1</span>) {
      <span class="kw">await</span> redis.<span class="fn">expire</span>(key, windowMs / <span class="num">1000</span>);
    }

    <span class="kw">if</span> (current > max) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">429</span>).<span class="fn">json</span>({ error: <span class="str">'Too Many Requests'</span> });
    }

    <span class="fn">next</span>();
  };
};</code></pre>

<h2>Circuit Breaking</h2>
<p>The most important reliability feature is the circuit breaker. When an upstream service starts failing, the breaker opens and immediately returns 503 responses instead of letting requests pile up and cascade through the system.</p>
<p>After 30 seconds, it moves to a half-open state and lets a single request through to test recovery. If that succeeds, the circuit closes again. This pattern alone cut our incident response time significantly.</p>

<h2>Results</h2>
<p>After deploying the gateway, our mobile app's startup time dropped by 40% — one request instead of three. Client-side complexity dropped dramatically, and we finally had a single place to add observability, logging, and security controls.</p>
<p>The gateway now handles 12,000 requests per second with less than 3ms overhead per request. Not bad for a weekend project that became production infrastructure.</p>

<p>I've used every major React charting library. Recharts is easy but inflexible. Victory is composable but slow. Nivo is beautiful but massive. Chart.js wraps are convenient but opaque. And raw D3 in React is a pain to manage.</p>

<h2>The Core Problem</h2>

<h1>Real-Time Collaboration at Scale with WebSockets and Redis</h1>
<div class="post-author-row">
    <div class="post-author-avatar" style="background:#6366f1">BC</div>
    <div>
        <div class="post-author-name">Brian Codington</div>
        <div class="post-author-date">November 3, 2023</div>
    </div>
    <span class="post-read-time">10 min read</span>
</div>
<div class="prose">
<p>When we added real-time collaboration to TaskFlow, the first question was simple: how do you tell every user in a project that someone just moved a task to Done — in under 20 milliseconds, reliably, at scale?</p>

<h2>The Architecture</h2>
<p>The answer is Socket.io on the server side with Redis pub/sub as the message broker. When a task update comes in over a WebSocket connection, the server persists it to PostgreSQL, then publishes the change to a Redis channel. Every server instance subscribed to that channel forwards the update to all connected clients in that project room.</p>

<pre><code><span class="cm">// Server-side task update handler</span>
socket.<span class="fn">on</span>(<span class="str">'task:update'</span>, <span class="kw">async</span> ({ taskId, changes, projectId }) => {
  <span class="kw">const</span> hasAccess = <span class="kw">await</span> <span class="fn">checkProjectAccess</span>(socket.userId, projectId);
  <span class="kw">if</span> (!hasAccess) <span class="kw">return</span> socket.<span class="fn">emit</span>(<span class="str">'error'</span>, { message: <span class="str">'Access denied'</span> });

  <span class="kw">const</span> updated = <span class="kw">await</span> Task.<span class="fn">update</span>(taskId, changes);

  io.<span class="fn">to</span>(<span class="str">\`project:\${projectId}\`</span>).<span class="fn">emit</span>(<span class="str">'task:updated'</span>, {
    taskId,
    changes: updated,
    updatedBy: socket.userId,
    timestamp: <span class="kw">new</span> <span class="cls">Date</span>().<span class="fn">toISOString</span>()
  });
});</code></pre>

<h2>Handling Disconnections Gracefully</h2>
<p>The trickiest part isn't the happy path — it's reconnection. When a user's connection drops and reconnects, they may have missed several updates. We solve this by storing a sequence number on every event and replaying missed events on reconnect using a small Redis sorted set per project room.</p>

<h2>Numbers</h2>
<p>In production with 15,000 daily active users, we see sustained WebSocket latency under 20ms at the 99th percentile. Redis pub/sub handles the fan-out with ease — we've never come close to its throughput limits at our scale.</p>
<p>The lesson: for real-time collaboration, the architecture matters far more than the language or framework. Get the data flow right, and the rest follows.</p>
</div>`

<p>The hosted CMS market is full of products that are either too simple or too expensive. After my third migration away from a platform that changed its pricing model, I decided to build my own.</p>

<h2>The Stack</h2>
<p>OpenBlog runs on FastAPI for the content API and Next.js for the frontend. FastAPI was the right call for the backend: async by default, automatic OpenAPI docs, and Pydantic for schema validation. The resulting API is clean enough that I could swap the frontend for anything — a mobile app, a CLI, a different framework.</p>

    page: <span class="cls">int</span> = <span class="cls">Query</span>(<span class="num">1</span>, ge=<span class="num">1</span>),
    limit: <span class="cls">int</span> = <span class="cls">Query</span>(<span class="num">20</span>, ge=<span class="num">1</span>, le=<span class="num">100</span>),
    tag: <span class="cls">Optional</span>[<span class="cls">str</span>] = <span class="kw">None</span>,
    db: <span class="cls">AsyncSession</span> = <span class="cls">Depends</span>(get_db)
):
    query = <span class="fn">select</span>(<span class="cls">Post</span>).<span class="fn">where</span>(<span class="cls">Post</span>.status == <span class="str">"published"</span>)
    <span class="kw">if</span> tag:
        query = query.<span class="fn">join</span>(<span class="cls">Post</span>.tags).<span class="fn">where</span>(<span class="cls">Tag</span>.slug == tag)
    result = <span class="kw">await</span> db.<span class="fn">execute</span>(query.<span class="fn">limit</span>(limit))
    <span class="kw">return</span> result.<span class="fn">scalars</span>().<span class="fn">all</span>()</code></pre>

<h2>ISR: The Secret Weapon</h2>
<p>Next.js Incremental Static Regeneration is what makes the frontend fast without a CDN contract. Pages are statically generated at build time, served from cache, and regenerated in the background when content changes. The result: sub-80ms TTFB for every page load, regardless of database load.</p>

<h2>The Cost</h2>
<p>I run OpenBlog on a $6/month VPS. Postgres, Redis, FastAPI, and Next.js all on the same box. For a personal blog or small team, the hosted CMS model just doesn't make financial sense when the self-hosted alternative is this straightforward.</p>
</div>`
    }
];

let currentView = 'list';

function showView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${view}`).classList.add('active');

    document.querySelectorAll('.header-nav a').forEach(a => a.classList.remove('active'));
    if (view === 'list' || view === 'post') document.getElementById('nav-blog').classList.add('active');
    if (view === 'editor') document.getElementById('nav-editor').classList.add('active');

    currentView = view;
}

//  POST LIST
// ============================================================

function renderPostList() {
    const container = document.getElementById('post-list');
    container.innerHTML = POSTS.map(post => `
        <article class="post-card" onclick="showPost(${post.id})">
            <div class="post-tags">
                ${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            <h2>${post.title}</h2>
            <div class="post-meta">
                <div class="author-avatar" style="background:${post.author.color}">${post.author.initials}</div>
                <span>${post.author.name}</span>
                <span>·</span>
                <span>${post.date}</span>
                <span>·</span>
                <span>${post.readTime}</span>
            </div>
            <p class="post-excerpt">${post.excerpt}</p>
            <span class="read-more">Read more →</span>
        </article>
    `).join('');
}

function showPost(id) {
    const post = POSTS.find(p => p.id === id);
    if (!post) return;
    document.getElementById('post-content').innerHTML = post.content;
    showView('post');
    window.scrollTo(0, 0);
}

function updatePreview() {
    const raw = document.getElementById('editor-input').value;
    document.getElementById('editor-preview').innerHTML = parseMarkdown(raw);
}

function parseMarkdown(md) {
    return md
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/```[\w]*\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<[hupb]|<li|<block)(.+)$/gm, (m) => m.startsWith('<') ? m : `<p>${m}</p>`);
}

function setEditorMode(mode) {
    document.querySelectorAll('.editor-toolbar .toolbar-btn').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && mode === 'markdown') || (i === 1 && mode === 'rich'));
    });
}
